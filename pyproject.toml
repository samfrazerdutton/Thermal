[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal"
version = "0.1.0"
description = "Closed-loop performance engineering system for AI and accelerated workloads."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "nvidia-ml-py>=12.0",
    "jsonschema>=4.20",
    "torch",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ninja>=1.11", "httpx>=0.27", "ruff>=0.6"]
# Optional AI explanation layer (Phase 16) -- everything else in THERMAL
# works without this and without ANTHROPIC_API_KEY set.
ai = ["anthropic>=0.30"]

[project.scripts]
thermal = "thermal.cli:main"

[tool.setuptools.packages.find]
where = ["python", "services"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["python", "services"]

[tool.ruff]
line-length = 120
exclude = ["build", "native"]
