[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal"
version = "0.1.0"
description = "Closed-loop performance engineering system for AI and accelerated workloads."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "psutil>=5.9",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
thermal = "thermal.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["python"]
