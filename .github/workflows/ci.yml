name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-unit-tests:
    name: Python unit tests (CPU-only, no GPU runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/unit -v
      - name: Run integration tests (API, CPU-only)
        run: python -m pytest tests/integration -v
      - name: thermal doctor (expect NOT READY: no GPU on this runner)
        run: python -m thermal.cli doctor || true

  gpu-hardware-dependent-tests:
    name: GPU-dependent tests (label only — no GPU runner available)
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "GPU-dependent tests (native/cuda, NVML telemetry against real hardware," \
               "CUDA kernel benchmarks) require a self-hosted NVIDIA runner and are not" \
               "part of this workflow. See docs/roadmap.md Phase 17."
